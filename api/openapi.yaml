      responses:
        "200":
          description: PDF
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /cabinet/profile:
    get:
      tags: [Кабинет нанимателя]
