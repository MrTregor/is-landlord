openapi: 3.1.0
info:
  title: Наймодатель — REST API
  version: 1.0.0
  description: |
    API информационной системы управления арендой жилой недвижимости «Наймодатель».
    Единственный источник контракта: из этого файла генерируются код сервера (oapi-codegen) и типы фронтенда (openapi-typescript).

    Соглашения (docs/spec/06 API.md, раздел 1):
    - деньги — целые копейки, поля оканчиваются на `Kop`;
    - десятичные значения (ставки, тарифы, показания, площадь) — строки;
    - даты — `YYYY-MM-DD`, моменты времени — RFC 3339 в UTC;
    - списки: `page` (с 1), `pageSize` (по умолчанию 25, максимум 100), `sort` (`field` / `-field`);
    - аутентификация — cookie `ll_session`; для POST/PUT/PATCH/DELETE обязателен заголовок `X-CSRF-Token`
      (кроме `/auth/login`, `/auth/invite/accept`, `/auth/password/forgot`, `/auth/password/reset`, `/integrations/*`);
    - ошибки — `application/problem+json` (схема `Problem`);
    - ответ всегда содержит заголовок `X-Request-Id`.

    Права в описании методов: О — собственник, Н — наниматель, П — без входа, И — интеграция.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Служебное
  - name: Вход
  - name: Пользователи
  - name: Настройки
  - name: Сводка
  - name: Файлы
  - name: Объекты
  - name: Наниматели
  - name: Договоры
  - name: Допсоглашения и акты
  - name: Документы
  - name: Начисления
  - name: Платежи
  - name: Залог
  - name: Чеки
  - name: Сверка
  - name: Показания
  - name: Заявки
  - name: Затраты
  - name: Календарь
  - name: Отчёты
  - name: Журнал действий
  - name: Письма
  - name: Кабинет нанимателя
  - name: Интеграции
  - name: Демо-режим

paths:
  # ---------------------------------------------------------------- 2. Служебное
  /healthz:
    get:
      tags: [Служебное]
      operationId: getHealthz
      summary: Процесс жив (П)
      security: []
      responses:
        "200":
          description: Процесс работает
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      tags: [Служебное]
      operationId: getReadyz
      summary: Готовность к работе (П)
      description: 200, если доступны БД и Gotenberg, иначе 503.
      security: []
      responses:
        "200":
          description: Готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503":
          description: Не готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
  /public/privacy-policy:
    get:
      tags: [Служебное]
      operationId: getPrivacyPolicy
      summary: Политика обработки персональных данных (П)
      security: []
      responses:
        "200":
          description: Текущая версия политики
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
        default: { $ref: "#/components/responses/Problem" }
  /public/app-info:
    get:
      tags: [Служебное]
      operationId: getAppInfo
      summary: Название системы и организации (П)
      security: []
      responses:
        "200":
          description: Сведения для страницы входа и подвала
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInfo" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- 3. Вход и учётные записи
  /auth/login:
    post:
      tags: [Вход]
      operationId: login
      summary: Вход (П)
      description: Ошибки — `invalid_credentials`, `login_locked`, `rate_limited`. Устанавливает cookie `ll_session`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [Вход]
      operationId: logout
      summary: Выход (О, Н)
      description: Сессия отзывается, cookie удаляется.
      responses:
        "204":
          description: Выход выполнен
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      tags: [Вход]
      operationId: getMe
      summary: Текущий пользователь (О, Н)
      responses:
        "200":
          description: Пользователь и CSRF-токен сессии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/password/change:
    post:
      tags: [Вход]
      operationId: changePassword
      summary: Смена пароля (О, Н)
      description: Все прочие сессии пользователя отзываются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Пароль изменён }
        default: { $ref: "#/components/responses/Problem" }
  /auth/password/forgot:
    post:
      tags: [Вход]
      operationId: forgotPassword
      summary: Запрос восстановления пароля (П)
      description: Всегда 204 — ответ не раскрывает наличие адреса.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "204": { description: Запрос принят }
        default: { $ref: "#/components/responses/Problem" }
  /auth/password/reset:
    post:
      tags: [Вход]
      operationId: resetPassword
      summary: Новый пароль по ссылке из письма (П)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Пароль изменён }
        default: { $ref: "#/components/responses/Problem" }
  /auth/invite/{token}:
    get:
      tags: [Вход]
      operationId: getInvite
      summary: Сведения о приглашении (П)
      description: 404 — «Приглашение недействительно или истекло».
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Приглашение действительно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/invite/accept:
    post:
      tags: [Вход]
      operationId: acceptInvite
      summary: Принять приглашение и задать пароль (П)
      description: Фиксируется ознакомление с политикой (`users.policy_accepted_version`); согласие на ПДн не создаётся.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Пароль задан, вход выполнен
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/accept-policy:
    post:
      tags: [Вход]
      operationId: acceptPolicy
      summary: Ознакомление с текущей версией политики (Н)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptPolicyRequest" }
      responses:
        "204": { description: Ознакомление зафиксировано }
        default: { $ref: "#/components/responses/Problem" }

  /users:
    get:
      tags: [Пользователи]
      operationId: listUsers
      summary: Список пользователей (О)
      parameters:
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Пользователи
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Пользователи]
      operationId: createUser
      summary: Добавить собственника (О)
      description: Создаёт пользователя-собственника в статусе `invited` и письмо `invite`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateInput" }
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /users/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Пользователи]
      operationId: updateUser
      summary: Изменить имя или статус пользователя (О)
      description: Себя заблокировать нельзя. Блокировка отзывает сессии.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /users/{id}/resend-invite:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Пользователи]
      operationId: resendInvite
      summary: Отправить приглашение повторно (О)
      description: Создаётся новый токен, старый становится недействительным.
      responses:
        "204": { description: Приглашение отправлено }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- 4. Настройки
  /settings/organization:
    get:
      tags: [Настройки]
      operationId: getOrganizationSettings
      summary: Реквизиты и настройки организации (О)
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Настройки]
      operationId: updateOrganizationSettings
      summary: Сохранить настройки организации (О)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationSettingsInput" }
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/tariffs:
    get:
      tags: [Настройки]
      operationId: listTariffs
      summary: Тарифы (О)
      parameters:
        - name: meterType
          in: query
          schema: { $ref: "#/components/schemas/MeterType" }
        - name: propertyId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Все тарифы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TariffDTO" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Настройки]
      operationId: createTariff
      summary: Добавить тариф (О)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TariffInput" }
      responses:
        "201":
          description: Тариф добавлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TariffDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/tariffs/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    delete:
      tags: [Настройки]
      operationId: deleteTariff
      summary: Удалить тариф (О)
      description: Запрещено, если есть неотменённое начисление ЖКУ с месяцем ≥ даты тарифа по объекту, к которому применим тариф.
      responses:
        "204": { description: Тариф удалён }
        default: { $ref: "#/components/responses/Problem" }
  /settings/email-templates:
    get:
      tags: [Настройки]
      operationId: listEmailTemplates
      summary: Шаблоны писем (О)
      responses:
        "200":
          description: Список шаблонов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmailTemplateListItem" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/email-templates/{code}:
    parameters:
      - { $ref: "#/components/parameters/EmailTemplateCode" }
    get:
      tags: [Настройки]
      operationId: getEmailTemplate
      summary: Шаблон письма (О)
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplateDTO" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Настройки]
      operationId: updateEmailTemplate
      summary: Сохранить шаблон письма (О)
      description: При сохранении проверяются переменные шаблона.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTemplateInput" }
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplateDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/email-templates/{code}/reset:
    parameters:
      - { $ref: "#/components/parameters/EmailTemplateCode" }
    post:
      tags: [Настройки]
      operationId: resetEmailTemplate
      summary: Вернуть текст письма по умолчанию (О)
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplateDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/email-templates/{code}/preview:
    parameters:
      - { $ref: "#/components/parameters/EmailTemplateCode" }
    post:
      tags: [Настройки]
      operationId: previewEmailTemplate
      summary: Предпросмотр письма на демо-данных (О)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTemplatePreviewRequest" }
      responses:
        "200":
          description: Тема и HTML письма
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplatePreview" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/document-templates:
    get:
      tags: [Настройки]
      operationId: listDocumentTemplates
      summary: Активные шаблоны документов по видам (О)
      responses:
        "200":
          description: Шаблоны
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentTemplateListItem" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/document-templates/{kind}:
    parameters:
      - { $ref: "#/components/parameters/DocumentKindPath" }
    get:
      tags: [Настройки]
      operationId: getDocumentTemplate
      summary: Активная версия шаблона и список версий (О)
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTemplateDetail" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Настройки]
      operationId: updateDocumentTemplate
      summary: Сохранить шаблон — новая версия становится активной (О)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentTemplateInput" }
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTemplateDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/document-templates/{kind}/versions/{id}:
    parameters:
      - { $ref: "#/components/parameters/DocumentKindPath" }
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Настройки]
      operationId: getDocumentTemplateVersion
      summary: Текст версии шаблона (О)
      responses:
        "200":
          description: Версия
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTemplateVersion" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/document-templates/{kind}/reset:
    parameters:
      - { $ref: "#/components/parameters/DocumentKindPath" }
    post:
      tags: [Настройки]
      operationId: resetDocumentTemplate
      summary: Новая версия с текстом системного шаблона (О)
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTemplateDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/document-templates/{kind}/preview:
    parameters:
      - { $ref: "#/components/parameters/DocumentKindPath" }
    post:
      tags: [Настройки]
      operationId: previewDocumentTemplate
      summary: Предпросмотр PDF на демо-данных (О)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentTemplatePreviewRequest" }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /settings/template-variables:
    get:
      tags: [Настройки]
      operationId: getTemplateVariables
      summary: Переменные шаблонов документов и писем (О)
      responses:
        "200":
          description: Переменные по видам документов и кодам писем
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVariables" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/jobs:
    get:
      tags: [Настройки]
      operationId: listJobs
      summary: Плановые задачи (О)
      responses:
        "200":
          description: Задачи с последним запуском
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/jobs/{name}/run:
    parameters:
      - name: name
        in: path
        required: true
        schema: { $ref: "#/components/schemas/JobName" }
    post:
      tags: [Настройки]
      operationId: runJob
      summary: Поставить задачу сейчас (О)
      responses:
        "202":
          description: Задача поставлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRunAccepted" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/jobs/runs:
    get:
      tags: [Настройки]
      operationId: listJobRuns
      summary: История запусков задач (О)
      parameters:
        - name: name
          in: query
          schema: { $ref: "#/components/schemas/JobName" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Запуски
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRunList" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/backups:
    get:
      tags: [Настройки]
      operationId: listBackups
      summary: Резервные копии (О, только чтение каталога)
      responses:
        "200":
          description: Файлы резервных копий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupFile" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- 5. Сводка
  /dashboard:
    get:
      tags: [Сводка]
      operationId: getDashboard
      summary: Сводка рабочего места (О)
      responses:
        "200":
          description: Показатели, объекты, ближайшие события
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- 6. Файлы
  /files:
    post:
      tags: [Файлы]
      operationId: uploadFile
      summary: Загрузить файл (О, Н)
      description: |
        Наниматель — только `request_photo`. Размер ≤ `MAX_UPLOAD_MB`; тип определяется по сигнатуре:
        изображения JPEG/PNG/WebP, документы PDF, выписки — текст/CSV.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "201":
          description: Файл сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDTO" }
        default: { $ref: "#/components/responses/Problem" }
  /files/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Файлы]
      operationId: getFile
      summary: Содержимое файла (О, Н)
      description: Наниматель — только файлы своих заявок, видимых документов и фото объекта своего договора.
      parameters:
        - { $ref: "#/components/parameters/Download" }
      responses:
        "200":
          description: Содержимое файла с сохранённым Content-Type
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
          content:
