      parameters:
        - { $ref: "#/components/parameters/CabinetContractId" }
      responses:
        "200":
          description: Платежи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CabinetPaymentDTO" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Кабинет нанимателя]
      operationId: createCabinetPayment
      summary: Начать онлайн-оплату (Н)
      description: |
        Для `charges`: пустой список — все открытые начисления с долгом (кроме пеней `accruing`); сумма — Σ долгов выбранных.
        Для `deposit`: сумма — `depositToPayKop` (> 0). Если есть неистёкший `pending` с той же суммой и составом — возвращается он.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinetPaymentInput" }
      responses:
        "201":
          description: Ссылка на страницу оплаты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinetPaymentStarted" }
        default: { $ref: "#/components/responses/Problem" }
