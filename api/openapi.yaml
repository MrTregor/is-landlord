        startsOn: { type: string, format: date }
        startTime: { type: [string, "null"], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: [string, "null"], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        propertyId: { type: [string, "null"], format: uuid }
        contractId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"], maxLength: 4000 }
    CalendarEventUpdateInput:
      type: object
      description: Для автоматических событий меняются только `notes`.
      properties:
        kind: { $ref: "#/components/schemas/ManualCalendarEventKind" }
        title: { type: string, minLength: 1, maxLength: 200 }
        startsOn: { type: string, format: date }
        startTime: { type: [string, "null"], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: [string, "null"], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        propertyId: { type: [string, "null"], format: uuid }
        contractId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"], maxLength: 4000 }

