        endTime: { type: [string, "null"], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        property:
          oneOf:
            - { $ref: "#/components/schemas/PropertyRef" }
            - { type: "null" }
        contract:
          oneOf:
            - { $ref: "#/components/schemas/ContractRef" }
            - { type: "null" }
