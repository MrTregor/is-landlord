        propertyId: { type: string, format: uuid }
        propertyCode: { type: string }
        incomeKop: { $ref: "#/components/schemas/Kop" }
        expensesKop: { $ref: "#/components/schemas/Kop" }
        resultKop: { $ref: "#/components/schemas/Kop" }
