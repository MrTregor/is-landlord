      type: object
      description: Доходные операции по видам (05 разд. 12.1); возвраты — со знаком минус.
      required: [rentKop, utilitiesKop, penaltyKop, damageKop, otherKop, advanceKop, depositWithheldKop, refundsKop, incomeKop]
      properties:
        rentKop: { $ref: "#/components/schemas/Kop" }
        utilitiesKop: { $ref: "#/components/schemas/Kop" }
        penaltyKop: { $ref: "#/components/schemas/Kop" }
        damageKop: { $ref: "#/components/schemas/Kop" }
        otherKop: { $ref: "#/components/schemas/Kop" }
        advanceKop: { $ref: "#/components/schemas/Kop" }
        depositWithheldKop: { $ref: "#/components/schemas/Kop" }
        refundsKop: { $ref: "#/components/schemas/Kop" }
        incomeKop: { $ref: "#/components/schemas/Kop", description: "Поступления, всего" }
