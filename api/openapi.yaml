      type: object
      required: [today]
      properties:
        today: { type: string, format: date }
    RunDailyResult:
      type: object
      required: [today, jobs]
      properties:
        today: { type: string, format: date }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobRunDTO" }
