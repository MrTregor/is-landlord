          required: [chargedKop, expensesKop, resultKop, marginPct, occupancyPct]
          properties:
            chargedKop: { $ref: "#/components/schemas/Kop" }
            expensesKop: { $ref: "#/components/schemas/Kop" }
            resultKop: { $ref: "#/components/schemas/Kop" }
            marginPct: { type: [string, "null"], pattern: '^-?\d+(\.\d+)?$' }
            occupancyPct: { type: [string, "null"], pattern: '^-?\d+(\.\d+)?$' }
