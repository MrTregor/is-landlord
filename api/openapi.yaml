  /integrations/atol/callback:
    post:
      tags: [Интеграции]
      operationId: atolCallback
      summary: Колбэк АТОЛ Онлайн о готовности чека (И)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtolCallback" }
      responses:
        "200":
          description: Колбэк принят

  # ---------------------------------------------------------------- 17. Только APP_ENV=demo
  /dev/clock:
    get:
      tags: [Демо-режим]
      operationId: getDevClock
      summary: Дата системы (О, только demo)
      responses:
        "200":
          description: Текущее время и сдвиг
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevClock" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Демо-режим]
      operationId: setDevClock
      summary: Сдвинуть дату системы (О, только demo)
