            taxBaseKop: { $ref: "#/components/schemas/Kop" }
            taxKop: { type: [integer, "null"], format: int64, description: "Округлён до рубля; null — для psn и osn" }
            incomeIndividualsKop: { type: [integer, "null"], format: int64, description: Только для npd }
            incomeLegalKop: { type: [integer, "null"], format: int64, description: Только для npd }
            taxIndividualsKop: { type: [integer, "null"], format: int64, description: Только для npd (4 %) }
            taxLegalKop: { type: [integer, "null"], format: int64, description: Только для npd (6 %) }
    TaxOperation:
      type: object
      required: [date, document, contract, tenant, property, kind, amountKop]
      properties:
        date: { type: string, format: date }
        document: { type: string, description: "Номер квитанции / «Удержание из залога от …» / «Возврат переплаты от …»" }
        contract: { $ref: "#/components/schemas/ContractRef" }
        tenant: { $ref: "#/components/schemas/TenantRef" }
        property: { $ref: "#/components/schemas/PropertyRef" }
        kind: { $ref: "#/components/schemas/IncomeKind" }
        amountKop: { $ref: "#/components/schemas/Kop" }
    TaxBaseReport:
      type: object
      required: [from, to, year, taxRegime, taxRatePct, regimeTitle, note, depositsReceivedKop, depositsRefundedKop, periods,
                 operations]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        year: { type: [integer, "null"] }
        taxRegime: { $ref: "#/components/schemas/TaxRegime" }
        taxRatePct: { $ref: "#/components/schemas/Decimal" }
        regimeTitle: { type: string, description: "«Режим: УСН „доходы“, ставка 6 %»" }
        note: { type: [string, "null"], description: "«Налог по этому режиму не рассчитывается» для psn и osn" }
        depositsReceivedKop: { $ref: "#/components/schemas/Kop" }
        depositsRefundedKop: { $ref: "#/components/schemas/Kop" }
        periods:
          type: array
          items: { $ref: "#/components/schemas/TaxPeriodRow" }
        operations:
          type: array
          items: { $ref: "#/components/schemas/TaxOperation" }
    IncomeBookRow:
      type: object
      required: [rowType, no, date, document, description, incomeKop, expensesKop]
      properties:
        rowType: { type: string, enum: [operation, quarter_total, year_total] }
        no: { type: [integer, "null"] }
        date: { type: [string, "null"], format: date }
        document: { type: [string, "null"], description: "«07.10.2026, квитанция КВ-2026-00048»" }
        description: { type: string }
        incomeKop: { $ref: "#/components/schemas/Kop" }
        expensesKop: { type: [integer, "null"], format: int64 }
    IncomeBookReport:
      type: object
      required: [year, orgName, inn, taxObject, rows]
      properties:
        year: { type: integer }
        orgName: { type: string }
        inn: { type: string }
        taxObject: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/IncomeBookRow" }

    # ============================================================ Журнал действий и письма
    AuditEntryDTO:
      type: object
      required: [id, occurredAt, actorUserId, actorName, actorRole, action, actionTitle, entityType, entityId, entityTitle, summary,
                 before, after, ip]
