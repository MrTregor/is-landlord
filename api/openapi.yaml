        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReopenInput" }
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinetRequestDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /cabinet/documents/{id}/pdf:
    parameters:
