        days31to60Kop: { $ref: "#/components/schemas/Kop" }
        days61to90Kop: { $ref: "#/components/schemas/Kop" }
        over90Kop: { $ref: "#/components/schemas/Kop" }
        penaltiesKop: { $ref: "#/components/schemas/Kop" }
        totalDebtKop: { $ref: "#/components/schemas/Kop" }
