          required: [label, cumulative, from, to, expensesKop, taxBaseKop, taxKop, incomeIndividualsKop, incomeLegalKop,
                     taxIndividualsKop, taxLegalKop]
          properties:
            label: { type: string, description: "«I квартал», «полугодие», «9 месяцев», «год»" }
            cumulative: { type: boolean, description: Нарастающий итог }
            from: { type: string, format: date }
            to: { type: string, format: date }
