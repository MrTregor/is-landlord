  /cabinet/consent/revoke:
    post:
      tags: [Кабинет нанимателя]
      operationId: revokeCabinetConsent
      summary: Отозвать согласие (Н)
      responses:
        "204": { description: Согласие отозвано }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- 16. Интеграции
  /integrations/tbank/notify:
    post:
      tags: [Интеграции]
      operationId: tbankNotify
      summary: Уведомление Т-Банка о платеже (И)
      description: Ответ — текст `OK` (HTTP 200) после сохранения события; при неверной подписи — 403 без тела.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TbankNotification" }
      responses:
        "200":
          description: Уведомление принято
