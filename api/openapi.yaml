        action: { type: string }
        actionTitle: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        entityTitle: { type: [string, "null"] }
        summary: { type: string }
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
        ip: { type: [string, "null"] }
    AuditList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntryDTO" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AuditVerifyResult:
      type: object
      required: [ok, checked, brokenAtId]
      properties:
        ok: { type: boolean }
        checked: { type: integer, format: int64 }
        brokenAtId: { type: [integer, "null"], format: int64 }
    EmailAttachment:
      type: object
