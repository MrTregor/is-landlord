        propertyId: { type: string, format: uuid }
        propertyCode: { type: string }
        periodDays: { type: integer }
        rentedDays: { type: integer }
        freeDays: { type: integer }
        reservedDays: { type: integer }
        repairDays: { type: integer }
        occupancyPct: { type: [string, "null"], pattern: '^-?\d+(\.\d+)?$' }
