  /cabinet/consent:
    post:
      tags: [Кабинет нанимателя]
      operationId: giveCabinetConsent
      summary: Отдельное электронное согласие на обработку ПДн (Н)
      description: Согласие на цель `pdn_consent_purpose` (`method = electronic`, фиксируется IP).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentAgreeInput" }
