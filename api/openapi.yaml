                 relatedEntityId, createdAt, sentAt]
      properties:
        id: { type: string, format: uuid }
        templateCode: { $ref: "#/components/schemas/EmailTemplateCode" }
        toEmail: { type: string }
        subject: { type: string }
        bodyHtml: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/EmailAttachment" }
        status: { $ref: "#/components/schemas/EmailStatus" }
        attempts: { type: integer }
        lastError: { type: [string, "null"] }
        relatedEntityType: { type: [string, "null"] }
        relatedEntityId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
    EmailLogList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EmailLogDTO" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ============================================================ Кабинет нанимателя
    CabinetContractItem:
      type: object
      required: [id, number, legalBasis, status, propertyCode, propertyAddress, startDate, endDate]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalBasis: { $ref: "#/components/schemas/LegalBasis" }
        status: { $ref: "#/components/schemas/ContractStatus" }
        propertyCode: { type: string }
        propertyAddress: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    CabinetChargeLine:
      type: object
      required: [chargeId, title, outstandingKop, dueDate, isOverdue]
      properties:
        chargeId: { type: string, format: uuid }
        title: { type: string }
        outstandingKop: { $ref: "#/components/schemas/Kop" }
        dueDate: { type: [string, "null"], format: date }
        isOverdue: { type: boolean }
    CabinetPendingPayment:
      type: object
      required: [id, paymentUrl, amountKop]
      properties:
        id: { type: string, format: uuid }
        paymentUrl: { type: string }
        amountKop: { $ref: "#/components/schemas/Kop" }
    CabinetSummary:
      type: object
      required: [contracts, contractId, dueTotalKop, overdue, nextDueDate, lines, penaltiesAccruingKop, depositExpectedKop,
                 depositBalanceKop, depositToPayKop, advanceKop, pendingPayment]
      properties:
        contracts:
          type: array
          items: { $ref: "#/components/schemas/CabinetContractItem" }
        contractId: { type: [string, "null"], format: uuid, description: "null — у нанимателя нет договоров" }
        dueTotalKop: { $ref: "#/components/schemas/Kop" }
        overdue: { type: boolean }
        nextDueDate: { type: [string, "null"], format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CabinetChargeLine" }
        penaltiesAccruingKop: { $ref: "#/components/schemas/Kop" }
        depositExpectedKop: { $ref: "#/components/schemas/Kop" }
        depositBalanceKop: { $ref: "#/components/schemas/Kop" }
        depositToPayKop: { $ref: "#/components/schemas/Kop" }
        advanceKop: { $ref: "#/components/schemas/Kop" }
        pendingPayment:
          oneOf:
            - { $ref: "#/components/schemas/CabinetPendingPayment" }
            - { type: "null" }
    CabinetDocumentDTO:
      type: object
      required: [id, kind, number, title, createdAt, pdfUrl]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        number: { type: [string, "null"] }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        pdfUrl: { type: string }
    CabinetContract:
      type: object
      required: [id, number, legalBasis, status, isShortTerm, propertyCode, propertyAddress, startDate, endDate, actualEndDate,
                 currentTerms, termsHistory, depositKop, utilitiesMode, penaltyEnabled, penaltyRatePct, penaltyGraceDays,
                 penaltyCapPct, penaltyOnUtilities, indexationEnabled, indexationPct, indexationPeriodMonths, specialTerms,
                 occupants, documents, amendments]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalBasis: { $ref: "#/components/schemas/LegalBasis" }
        status: { $ref: "#/components/schemas/ContractStatus" }
        isShortTerm: { type: boolean }
        propertyCode: { type: string }
        propertyAddress: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        actualEndDate: { type: string, format: date }
        currentTerms: { $ref: "#/components/schemas/ContractTermsDTO" }
        termsHistory:
          type: array
          items: { $ref: "#/components/schemas/ContractTermsDTO" }
        depositKop: { $ref: "#/components/schemas/Kop" }
        utilitiesMode: { $ref: "#/components/schemas/UtilitiesMode" }
        penaltyEnabled: { type: boolean }
        penaltyRatePct: { type: [string, "null"] }
        penaltyGraceDays: { type: integer }
        penaltyCapPct: { type: [string, "null"] }
        penaltyOnUtilities: { type: boolean }
        indexationEnabled: { type: boolean }
        indexationPct: { type: [string, "null"] }
        indexationPeriodMonths: { type: integer }
        specialTerms: { type: [string, "null"] }
        occupants:
          type: array
          items: { $ref: "#/components/schemas/OccupantDTO" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/CabinetDocumentDTO" }
        amendments:
          type: array
          description: Только подписанные.
          items: { $ref: "#/components/schemas/AmendmentDTO" }
    CabinetChargeDTO:
      type: object
      required: [id, kind, title, periodMonth, periodStart, periodEnd, dueDate, amountKop, paidKop, outstandingKop, status,
                 isOverdue, overdueDays, penaltyState, calcDetails, penaltyText]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ChargeKind" }
        title: { type: string }
        periodMonth: { type: [string, "null"], format: date }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        dueDate: { type: [string, "null"], format: date }
        amountKop: { $ref: "#/components/schemas/Kop" }
        paidKop: { $ref: "#/components/schemas/Kop" }
        outstandingKop: { $ref: "#/components/schemas/Kop" }
        status: { $ref: "#/components/schemas/ChargeStatus" }
        isOverdue: { type: boolean }
        overdueDays: { type: integer }
        penaltyState:
          oneOf:
            - { $ref: "#/components/schemas/PenaltyState" }
            - { type: "null" }
        calcDetails:
          type: [object, "null"]
          additionalProperties: true
          description: Для пеней — null (вместо него `penaltyText`).
        penaltyText: { type: [string, "null"], description: "«за N дн. по ставке 0,1 % в день»" }
    CabinetPaymentDTO:
      type: object
      required: [id, purpose, amountKop, receivedOn, createdAt, method, status, receiptNumber, receiptUrl, ofdReceiptUrl,
                 npdReceiptUrl]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/PaymentPurpose" }
        amountKop: { $ref: "#/components/schemas/Kop" }
        receivedOn: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        receiptNumber: { type: [string, "null"] }
        receiptUrl: { type: [string, "null"] }
        ofdReceiptUrl: { type: [string, "null"] }
        npdReceiptUrl: { type: [string, "null"] }
    CabinetPaymentInput:
      type: object
      required: [contractId, purpose, chargeIds]
      properties:
        contractId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/PaymentPurpose" }
        chargeIds:
          type: array
          items: { type: string, format: uuid }
    CabinetPaymentStarted:
      type: object
      required: [paymentId, paymentUrl]
      properties:
        paymentId: { type: string, format: uuid }
        paymentUrl: { type: string }
    CabinetPaymentStatus:
      type: object
      required: [id, status, amountKop, receiptNumber, contractId, purpose, chargeIds, fiscalReceiptExpected]
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        fiscalReceiptExpected:
          type: boolean
          description: По оплате формируется кассовый чек на e-mail (облачная касса, назначение «начисления») — «Чек придёт на e-mail» (15 разд. 3)
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amountKop: { $ref: "#/components/schemas/Kop" }
        receiptNumber: { type: [string, "null"] }
        purpose: { $ref: "#/components/schemas/PaymentPurpose" }
        chargeIds:
          type: array
          items: { type: string, format: uuid }
          description: Начисления оплаты — для «Попробовать снова» тем же составом (15 разд. 3)
    CabinetMeterReading:
      type: object
      required: [periodMonth, value, status, rejectReason]
      properties:
        periodMonth: { type: string, format: date }
        value: { $ref: "#/components/schemas/Decimal" }
        status: { $ref: "#/components/schemas/ReadingStatus" }
        rejectReason: { type: [string, "null"] }
    CabinetMeter:
      type: object
      required: [meterId, type, serialNumber, lastValue, lastDate, current, history]
      properties:
        meterId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/MeterType" }
        serialNumber: { type: [string, "null"] }
        lastValue: { type: [string, "null"], pattern: '^-?\d+(\.\d+)?$' }
        lastDate: { type: [string, "null"], format: date }
        current:
          oneOf:
            - { $ref: "#/components/schemas/CabinetMeterReading" }
            - { type: "null" }
        history:
          type: array
          description: Последние 12 месяцев.
          items: { $ref: "#/components/schemas/CabinetMeterReading" }
    ReadingsWindow:
      type: object
      required: [periodMonth, open, from, to]
      properties:
        periodMonth: { type: string, format: date }
        open: { type: boolean }
        from: { type: string, format: date }
        to: { type: string, format: date }
    CabinetMeters:
      type: object
      required: [meters, window]
      properties:
        meters:
          type: array
          items: { $ref: "#/components/schemas/CabinetMeter" }
        window: { $ref: "#/components/schemas/ReadingsWindow" }
    CabinetReadingInput:
      type: object
      required: [meterId, value]
      properties:
        meterId: { type: string, format: uuid }
        value: { $ref: "#/components/schemas/Decimal" }
    CabinetReadingsInput:
      type: object
      required: [contractId, periodMonth, readings]
      properties:
        contractId: { type: string, format: uuid }
        periodMonth: { type: string, format: date }
        readings:
          type: array
          items: { $ref: "#/components/schemas/CabinetReadingInput" }
    CabinetRequestListItem:
      type: object
      required: [id, number, title, category, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        title: { type: string }
        category: { $ref: "#/components/schemas/RequestCategory" }
        status: { $ref: "#/components/schemas/RequestStatus" }
        createdAt: { type: string, format: date-time }
    CabinetRequestInput:
      type: object
      required: [contractId, category, title, description, photoFileIds]
      properties:
        contractId: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/RequestCategory" }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        photoFileIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
    CabinetRequestDetail:
      allOf:
        - { $ref: "#/components/schemas/CabinetRequestListItem" }
        - type: object
          required: [description, plannedDate, photos, events]
          properties:
            description: { type: string }
            plannedDate: { type: [string, "null"], format: date }
            photos:
              type: array
              items: { $ref: "#/components/schemas/FileDTO" }
            events:
              type: array
              items: { $ref: "#/components/schemas/RequestEventDTO" }
    ReopenInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 4000 }
    CabinetConsent:
      type: object
      required: [givenOn, method]
      properties:
        givenOn: { type: string, format: date }
        method: { $ref: "#/components/schemas/ConsentMethod" }
    OrganizationContacts:
      type: object
      required: [shortName, phone, email]
      properties:
        shortName: { type: string }
        phone: { type: [string, "null"] }
        email: { type: string }
    CabinetProfile:
      type: object
      required: [displayName, email, phone, policyAcceptedVersion, policyAcceptedAt, consentPurpose, consent, organization]
      properties:
        displayName: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        policyAcceptedVersion: { type: [string, "null"] }
        policyAcceptedAt: { type: [string, "null"], format: date-time }
        consentPurpose: { type: string }
        consent:
          oneOf:
            - { $ref: "#/components/schemas/CabinetConsent" }
            - { type: "null" }
        organization: { $ref: "#/components/schemas/OrganizationContacts" }
    CabinetProfilePatch:
      type: object
      required: [phone]
      properties:
        phone: { type: [string, "null"], maxLength: 40 }
    ConsentAgreeInput:
      type: object
      required: [agree]
      properties:
        agree: { type: boolean, enum: [true] }

    # ============================================================ Интеграции
    TbankNotification:
      type: object
      description: |
        Уведомление Т-Банка (TerminalKey, OrderId, Success, Status, PaymentId, ErrorCode, Amount, CardId, Pan, ExpDate, Token).
        Подпись Token считается по всем полям корневого уровня, поэтому тело принимается как есть.
      additionalProperties: true
    AtolCallback:
      type: object
      description: Тело как у ответа `report` АТОЛ Онлайн; данные чека всегда берутся из `report`.
      additionalProperties: true

