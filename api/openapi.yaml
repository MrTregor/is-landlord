        "200":
          description: Заявка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinetRequestDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /cabinet/requests/{id}/reopen:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Кабинет нанимателя]
      operationId: reopenCabinetRequest
      summary: Не устранено — `done → in_progress` (Н)
