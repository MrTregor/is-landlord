      tags: [Кабинет нанимателя]
      operationId: getCabinetContract
      summary: Договор и документы (Н)
      responses:
        "200":
          description: Условия, проживающие, документы, история платы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinetContract" }
        default: { $ref: "#/components/responses/Problem" }
  /cabinet/charges:
    get:
      tags: [Кабинет нанимателя]
      operationId: listCabinetCharges
