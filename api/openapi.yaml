      responses:
        "200":
          description: Отчёт по задачам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDailyResult" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ll_session
      description: Сессионная cookie (HttpOnly, Secure, SameSite=Lax, Path=/).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Обязателен для POST/PUT/PATCH/DELETE; значение — `csrfToken` из `/auth/login` или `/auth/me`.

  headers:
    SetSessionCookie:
      description: Cookie `ll_session`.
      schema: { type: string }
    ContentDisposition:
      description: "`inline` или `attachment` (при `?download=1`) с именем файла на русском (RFC 5987)."
      schema: { type: string }

  responses:
    Problem:
      description: Ошибка в формате application/problem+json
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Xlsx:
      description: Файл Excel
      headers:
        Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Q:
      name: q
      in: query
      description: Поиск без учёта регистра.
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Download:
      name: download
      in: query
      description: "1 — отдать как вложение (`Content-Disposition: attachment`)."
      schema: { type: integer, enum: [0, 1] }
    EmailTemplateCode:
      name: code
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EmailTemplateCode" }
    DocumentKindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DocumentKind" }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    FromRequired:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToRequired:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    AsOf:
      name: asOf
      in: query
      schema: { type: string, format: date }
    Year:
      name: year
      in: query
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    YearRequired:
      name: year
      in: query
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    CabinetContractId:
      name: contractId
      in: query
      required: true
      schema: { type: string, format: uuid }

    ChargeContractId:
      name: contractId
      in: query
      schema: { type: string, format: uuid }
    ChargePropertyId:
      name: propertyId
      in: query
      schema: { type: string, format: uuid }
    ChargeTenantId:
      name: tenantId
      in: query
      schema: { type: string, format: uuid }
    ChargeKinds:
      name: kind
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/ChargeKind" }
    ChargeStatuses:
      name: status
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/ChargeStatus" }
    ChargeOverdue:
      name: overdue
      in: query
      description: Только просроченные.
      schema: { type: boolean }
    PeriodFrom:
      name: periodFrom
      in: query
      description: Месяц начисления с (первое число).
      schema: { type: string, format: date }
    PeriodTo:
      name: periodTo
      in: query
      description: Месяц начисления по (первое число).
      schema: { type: string, format: date }
    DueFrom:
      name: dueFrom
      in: query
      schema: { type: string, format: date }
    DueTo:
      name: dueTo
      in: query
      schema: { type: string, format: date }
    ChargeSort:
      name: sort
      in: query
      schema: { type: string, enum: [dueDate, -dueDate, periodMonth, -periodMonth, amountKop, -amountKop] }

    PaymentContractId:
      name: contractId
      in: query
      schema: { type: string, format: uuid }
    PaymentTenantId:
      name: tenantId
      in: query
      schema: { type: string, format: uuid }
    PaymentPropertyId:
      name: propertyId
      in: query
      schema: { type: string, format: uuid }
    PaymentStatusQ:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/PaymentStatus" }
    PaymentMethodQ:
      name: method
      in: query
      schema: { $ref: "#/components/schemas/PaymentMethod" }
    PaymentSourceQ:
      name: source
      in: query
      schema: { $ref: "#/components/schemas/PaymentSource" }
    PaymentSort:
      name: sort
      in: query
      schema: { type: string, enum: [receivedOn, -receivedOn, amountKop, -amountKop, createdAt, -createdAt] }

    ExpensePropertyId:
      name: propertyId
      in: query
      schema: { type: string, format: uuid }
    ExpenseCategoryQ:
      name: category
      in: query
      schema: { $ref: "#/components/schemas/ExpenseCategory" }
    ExpenseRequestId:
      name: maintenanceRequestId
      in: query
      schema: { type: string, format: uuid }
    ExpenseSort:
      name: sort
      in: query
      schema: { type: string, enum: [paidOn, -paidOn, amountKop, -amountKop] }

    AuditFrom:
      name: from
      in: query
      schema: { type: string, format: date }
    AuditTo:
      name: to
      in: query
      schema: { type: string, format: date }
    AuditActor:
      name: actorUserId
      in: query
      schema: { type: string, format: uuid }
    AuditEntityType:
      name: entityType
      in: query
      schema: { type: string, maxLength: 64 }
    AuditEntityId:
      name: entityId
      in: query
      schema: { type: string, maxLength: 64 }
    AuditAction:
      name: action
      in: query
      schema: { type: string, maxLength: 64 }

  schemas:
    # ============================================================ Общие типы
    Kop:
      type: integer
      format: int64
      description: Сумма в копейках.
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: Десятичное значение строкой (ставка, тариф, показание, площадь).
    Time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Время ЧЧ:ММ.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        requestId: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ContractRef:
      type: object
      required: [id, number]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
    PropertyRef:
      type: object
      required: [id, code]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
    TenantRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    SignRequest:
      type: object
      required: [signedOn]
      properties:
        signedOn: { type: string, format: date }
    PeriodInput:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    FileRef:
      type: object
      required: [fileId]
      properties:
        fileId: { type: string, format: uuid }
    CommentInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
    DoneInput:
      type: object
      required: [done]
      properties:
        done: { type: boolean }

    # ============================================================ Перечисления (подписи — 04 Модель данных)
    AppEnv: { type: string, enum: [dev, demo, prod] }
    UserRole: { type: string, enum: [owner, tenant] }
    UserStatus: { type: string, enum: [invited, active, blocked] }
    TaxRegime: { type: string, enum: [usn_income, usn_income_expense, npd, psn, osn] }
    FiscalMode: { type: string, enum: [none, cloud_kkt, npd_manual] }
    PropertyKind: { type: string, enum: [residential, non_residential] }
    PropertyStatus: { type: string, enum: [free, reserved, rented, repair] }
    InitialPropertyStatus: { type: string, enum: [free, repair] }
    ManualPropertyStatus:
      type: string
      enum: [free, reserved, repair]
      description: Статус `rented` вручную не ставится и не снимается — это делает договор.
    MeterType: { type: string, enum: [cold_water, hot_water, electricity, electricity_day, electricity_night, gas, heating] }
    TenantKind: { type: string, enum: [individual, legal] }
    DocType: { type: string, enum: [passport_rf, foreign_passport, other] }
    CabinetStatus: { type: string, enum: [none, invited, active, blocked] }
    ConsentMethod: { type: string, enum: [paper, electronic] }
    ContractStatus: { type: string, enum: [draft, active, extended, terminated, finished] }
    LegalBasis: { type: string, enum: [ch35, ch34] }
    UtilitiesMode: { type: string, enum: [included, meters, fixed] }
    TerminationInitiator: { type: string, enum: [landlord, tenant, mutual] }
    AmendmentKind: { type: string, enum: [indexation, rent_change, extension, terms_change, other] }
    AmendmentStatus: { type: string, enum: [draft, signed, cancelled] }
    ActKind: { type: string, enum: [handover, return] }
    ChargeKind: { type: string, enum: [rent, utilities, penalty, damage, other] }
    ManualChargeKind: { type: string, enum: [damage, other] }
    ChargeStatus: { type: string, enum: [open, partially_paid, paid, cancelled] }
    PenaltyState: { type: string, enum: [accruing, final, manual] }
    ChargeOrigin: { type: string, enum: [auto, manual] }
    AdjustmentKind: { type: string, enum: [manual, termination, terms_change, penalty_recalc, penalty_manual_set, penalty_writeoff] }
    PaymentPurpose: { type: string, enum: [charges, deposit] }
    PaymentMethod: { type: string, enum: [online, bank_transfer, cash, deposit_offset] }
    ManualPaymentMethod: { type: string, enum: [bank_transfer, cash] }
    PaymentSource: { type: string, enum: [online, manual, bank_import, deposit_offset] }
    PaymentStatus: { type: string, enum: [pending, succeeded, failed, cancelled] }
    RefundMethod: { type: string, enum: [bank_transfer, cash] }
    DepositOperationKind: { type: string, enum: [receipt, withholding, offset, refund] }
    FiscalStatus: { type: string, enum: [queued, wait, done, fail, manual_required] }
    FiscalOperation: { type: string, enum: [sell, sell_refund] }
    FiscalProvider: { type: string, enum: [atol, npd_manual] }
    ReadingSource: { type: string, enum: [owner, tenant, act_handover, act_return] }
    ReadingStatus: { type: string, enum: [submitted, accepted, rejected] }
    RequestCategory: { type: string, enum: [plumbing, electrical, heating, appliance, furniture, doors_windows, other] }
    RequestPriority: { type: string, enum: [low, normal, high] }
    RequestStatus: { type: string, enum: [new, in_progress, done, closed] }
    RequestEventKind: { type: string, enum: [status, comment] }
    ExpenseCategory: { type: string, enum: [repair, maintenance, utilities_owner, tax, insurance, furniture_appliances, commission, other] }
    ExpenseRecovery: { type: string, enum: [none, deposit, charge] }
    CalendarEventKind:
      type: string
      enum: [payment_due, overdue, contract_end, contract_end_notice, registration, indexation, meter_verification, showing, repair, custom]
    ManualCalendarEventKind: { type: string, enum: [showing, repair, custom] }
    CalendarEventSource: { type: string, enum: [auto, manual, computed] }
    DiscrepancyKind: { type: string, enum: [underpayment, overpayment, unidentified] }
    DiscrepancyStatus: { type: string, enum: [open, resolved] }
    DiscrepancyResolution: { type: string, enum: [linked, refunded, kept_as_advance, moved_to_deposit, acknowledged, ignored, auto_closed] }
    DiscrepancyAction: { type: string, enum: [link, returned_to_payer, ignore, keep_advance, refund, move_to_deposit, acknowledge] }
    BankLineStatus: { type: string, enum: [matched, possible_duplicate, unmatched, duplicate, linked_manual, refunded, ignored] }
    MatchMethod: { type: string, enum: [contract_number, payer_inn, payer_name, manual] }
    StatementFormat: { type: string, enum: ["1c", csv] }
    DocumentKind: { type: string, enum: [contract_ch35, contract_ch34, act_handover, act_return, amendment, payment_receipt, reconciliation_act, pdn_consent] }
    FileCategory: { type: string, enum: [property_photo, request_photo, expense_doc, consent_scan, document_pdf, signed_scan, bank_statement, export, other] }
    EmailStatus: { type: string, enum: [queued, sent, failed, skipped] }
    EmailRecipient: { type: string, enum: [tenant, owner, user] }
    EmailTemplateCode:
      type: string
      enum: [invite, password_reset, payment_reminder, payment_overdue, payment_receipt, fiscal_receipt, contract_ending,
             rent_changed, readings_reminder, readings_rejected, request_status_changed, deposit_withheld, deposit_refunded,
             owner_payment_received, owner_discrepancy, owner_request_created, owner_readings_submitted, owner_indexation_due,
             owner_fiscal_error, owner_daily_digest]
    JobName:
      type: string
      enum: [contracts.daily, billing.rent_daily, billing.penalties_daily, billing.indexation_daily, pdn.retention_daily,
             maintenance.cleanup, notify.owner_digest, notify.payment_reminders, notify.contract_end, notify.readings_reminder,
             fiscal.reconcile, payments.expire_pending]
    JobTrigger: { type: string, enum: [schedule, manual] }
    JobRunStatus: { type: string, enum: [running, succeeded, failed] }
    AuditActorRole: { type: string, enum: [owner, tenant, system] }
    IncomeKind:
      type: string
      enum: [rent, utilities, penalty, damage, other, advance, deposit_withholding, refund, advance_to_deposit]
      description: Вид доходной операции (05 разд. 12.1).

    # ============================================================ Служебное
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    CheckStatus: { type: string, enum: [ok, error] }
    ReadyStatus:
      type: object
      required: [status, database, gotenberg]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { $ref: "#/components/schemas/CheckStatus" }
        gotenberg: { $ref: "#/components/schemas/CheckStatus" }
    PrivacyPolicy:
      type: object
      required: [version, html]
      properties:
        version: { type: string }
        html: { type: string }
    AppInfo:
      type: object
      required: [appName, orgShortName, env]
      properties:
        appName: { type: string }
        orgShortName: { type: [string, "null"] }
        env: { $ref: "#/components/schemas/AppEnv" }

    # ============================================================ Вход и пользователи
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    UserDTO:
      type: object
      required: [id, email, role, status, displayName, tenantId, lastLoginAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        displayName: { type: string }
        tenantId: { type: [string, "null"], format: uuid }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, csrfToken, mustAcceptPolicy, policyVersion]
      properties:
        user: { $ref: "#/components/schemas/UserDTO" }
        csrfToken: { type: string }
        mustAcceptPolicy: { type: boolean }
        policyVersion: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 1, maxLength: 256, description: "Не короче 10 символов, буквы и цифры (проверяет сервер)" }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 1, maxLength: 256, description: "Не короче 10 символов, буквы и цифры (проверяет сервер)" }
    InviteInfo:
      type: object
      required: [email, displayName, role]
      properties:
        email: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 256, description: "Не короче 10 символов, буквы и цифры (проверяет сервер)" }
        acceptPolicyVersion:
          type: [string, "null"]
          description: Версия политики, с которой ознакомился наниматель (для нанимателя обязательна).
    AcceptPolicyRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, minLength: 1, maxLength: 20 }
    UserList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDTO" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    UserCreateInput:
      type: object
      required: [email, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
    UserUpdateInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, blocked] }

    # ============================================================ Настройки
    OrganizationSettingsInput:
      type: object
      required: [fullName, shortName, inn, ogrnip, address, phone, email, bankName, bankBik, bankAccount, bankCorrAccount,
                 signatoryName, documentCity, taxRegime, taxRatePct, vatPayer, defaultFiscalModeResidential,
                 defaultFiscalModeNonResidential, pdnRetentionYears, privacyPolicyVersion, privacyPolicyHtml, pdnConsentPurpose,
                 remindBeforeDueDays, overdueRepeatDays, contractEndNoticeDays, readingsReminderDay, readingsAutoAccept,
                 ownerDailyDigest, indexationDraftDaysBefore]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 300 }
        shortName: { type: string, minLength: 1, maxLength: 120 }
        inn: { type: string, pattern: '^\d{10}(\d{2})?$' }
        ogrnip: { type: [string, "null"], pattern: '^\d{15}$' }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone: { type: [string, "null"], maxLength: 40 }
        email: { type: string, format: email, maxLength: 254, x-go-type: string }
        bankName: { type: [string, "null"], maxLength: 200 }
        bankBik: { type: [string, "null"], pattern: '^\d{9}$' }
        bankAccount: { type: [string, "null"], pattern: '^\d{20}$' }
        bankCorrAccount: { type: [string, "null"], pattern: '^\d{20}$' }
        signatoryName: { type: string, minLength: 1, maxLength: 120 }
        documentCity: { type: string, minLength: 1, maxLength: 120 }
        taxRegime: { $ref: "#/components/schemas/TaxRegime" }
        taxRatePct: { $ref: "#/components/schemas/Decimal" }
        vatPayer: { type: boolean }
        defaultFiscalModeResidential: { $ref: "#/components/schemas/FiscalMode" }
        defaultFiscalModeNonResidential: { $ref: "#/components/schemas/FiscalMode" }
        pdnRetentionYears: { type: integer, minimum: 1, maximum: 10 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 20 }
        privacyPolicyHtml: { type: string, minLength: 1 }
        pdnConsentPurpose: { type: string, minLength: 1, maxLength: 1000 }
        remindBeforeDueDays: { type: integer, minimum: 0, maximum: 15 }
        overdueRepeatDays: { type: integer, minimum: 1, maximum: 30 }
        contractEndNoticeDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 365 }
        readingsReminderDay: { type: integer, minimum: 1, maximum: 28 }
        readingsAutoAccept: { type: boolean }
        ownerDailyDigest: { type: boolean }
        indexationDraftDaysBefore: { type: integer, minimum: 7, maximum: 90 }
    OrganizationSettings:
      allOf:
        - { $ref: "#/components/schemas/OrganizationSettingsInput" }
        - type: object
          required: [updatedAt, updatedBy]
          properties:
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: [string, "null"], format: uuid }
    TariffInput:
      type: object
      required: [meterType, propertyId, price, effectiveFrom, note]
      properties:
        meterType: { $ref: "#/components/schemas/MeterType" }
        propertyId: { type: [string, "null"], format: uuid, description: "null — для всех объектов" }
        price: { $ref: "#/components/schemas/Decimal" }
        effectiveFrom: { type: string, format: date }
        note: { type: [string, "null"], maxLength: 500 }
    TariffDTO:
      type: object
      required: [id, meterType, propertyId, propertyCode, price, effectiveFrom, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        meterType: { $ref: "#/components/schemas/MeterType" }
        propertyId: { type: [string, "null"], format: uuid }
        propertyCode: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Decimal" }
        effectiveFrom: { type: string, format: date }
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    EmailTemplateListItem:
      type: object
      required: [code, name, recipient, subject, enabled, updatedAt]
      properties:
        code: { $ref: "#/components/schemas/EmailTemplateCode" }
        name: { type: string }
        recipient: { $ref: "#/components/schemas/EmailRecipient" }
        subject: { type: string }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
    EmailTemplateDTO:
      allOf:
        - { $ref: "#/components/schemas/EmailTemplateListItem" }
        - type: object
          required: [bodyHtml]
          properties:
            bodyHtml: { type: string }
    EmailTemplateInput:
      type: object
      required: [subject, bodyHtml, enabled]
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        bodyHtml: { type: string, minLength: 1 }
        enabled: { type: boolean }
    EmailTemplatePreviewRequest:
      type: object
      required: [subject, bodyHtml]
      properties:
        subject: { type: string, maxLength: 300 }
        bodyHtml: { type: string }
    EmailTemplatePreview:
      type: object
      required: [subject, html]
      properties:
        subject: { type: string }
        html: { type: string }
    DocumentTemplateVersionSummary:
      type: object
      required: [id, version, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, "null"], description: Имя пользователя }
    DocumentTemplateListItem:
      type: object
      required: [kind, name, version, createdAt, createdBy]
      properties:
        kind: { $ref: "#/components/schemas/DocumentKind" }
        name: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, "null"] }
    DocumentTemplateVersion:
      type: object
      required: [id, kind, name, version, bodyHtml, isActive, isSystem, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        name: { type: string }
        version: { type: integer }
        bodyHtml: { type: string }
        isActive: { type: boolean }
        isSystem: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, "null"] }
    DocumentTemplateDetail:
      type: object
      required: [kind, active, versions]
      properties:
        kind: { $ref: "#/components/schemas/DocumentKind" }
        active: { $ref: "#/components/schemas/DocumentTemplateVersion" }
        versions:
          type: array
          items: { $ref: "#/components/schemas/DocumentTemplateVersionSummary" }
    DocumentTemplateInput:
      type: object
      required: [name, bodyHtml]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        bodyHtml: { type: string, minLength: 1 }
    DocumentTemplatePreviewRequest:
      type: object
      required: [bodyHtml]
      properties:
        bodyHtml: { type: string, minLength: 1 }
    TemplateVariable:
      type: object
      required: [key, title, example]
      properties:
        key: { type: string, description: "Ключ переменной или блока (block:имя)" }
        title: { type: string }
        example: { type: string }
    TemplateVariables:
      type: object
      required: [documents, emails]
      properties:
        documents:
          type: object
          description: Вид документа → переменные.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/TemplateVariable" }
        emails:
          type: object
          description: Код письма → переменные.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/TemplateVariable" }
    JobRunDTO:
      type: object
      required: [id, jobName, businessDate, trigger, startedAt, finishedAt, status, stats, errorText]
      properties:
        id: { type: string, format: uuid }
        jobName: { $ref: "#/components/schemas/JobName" }
        businessDate: { type: string, format: date }
        trigger: { $ref: "#/components/schemas/JobTrigger" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/JobRunStatus" }
        stats:
          type: object
          additionalProperties: true
          description: 'Статистика запуска, например {"contracts":12,"created":8,"skipped":4,"errors":[]}'
        errorText: { type: [string, "null"] }
    JobDTO:
      type: object
      required: [name, title, schedule, lastRun]
      properties:
        name: { $ref: "#/components/schemas/JobName" }
        title: { type: string }
        schedule: { type: string, description: "Расписание (cron, Europe/Moscow)" }
        lastRun:
          oneOf:
            - { $ref: "#/components/schemas/JobRunDTO" }
            - { type: "null" }
    JobRunAccepted:
      type: object
      required: [jobRunId]
      properties:
        jobRunId: { type: string, format: uuid }
    JobRunList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobRunDTO" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    BackupFile:
      type: object
      required: [fileName, sizeBytes, createdAt]
      properties:
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    # ============================================================ Сводка
    DashboardIncomeMonth:
      type: object
      required: [month, amountKop]
      properties:
        month: { type: string, format: date }
        amountKop: { $ref: "#/components/schemas/Kop" }
    DashboardProperty:
      type: object
      required: [id, code, status, tenantName, contractId, contractNumber, endDate, debtKop]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: "#/components/schemas/PropertyStatus" }
        tenantName: { type: [string, "null"] }
        contractId: { type: [string, "null"], format: uuid }
        contractNumber: { type: [string, "null"] }
        endDate: { type: [string, "null"], format: date }
        debtKop: { $ref: "#/components/schemas/Kop" }
    Dashboard:
      type: object
      required: [today, incomeMonthKop, incomePrevMonthKop, debtTotalKop, overdueKop, overdueContracts, occupancyPct,
                 openRequests, openDiscrepancies, fiscalProblems, pendingReadings, incomeByMonth, properties, upcoming]
      properties:
        today: { type: string, format: date }
        incomeMonthKop: { $ref: "#/components/schemas/Kop" }
        incomePrevMonthKop: { $ref: "#/components/schemas/Kop" }
        debtTotalKop: { $ref: "#/components/schemas/Kop" }
        overdueKop: { $ref: "#/components/schemas/Kop" }
        overdueContracts: { type: integer }
        occupancyPct: { $ref: "#/components/schemas/Decimal" }
        openRequests: { type: integer }
        openDiscrepancies: { type: integer }
        fiscalProblems: { type: integer }
        pendingReadings: { type: integer }
        incomeByMonth:
          type: array
          description: 12 последних месяцев.
          items: { $ref: "#/components/schemas/DashboardIncomeMonth" }
        properties:
          type: array
          items: { $ref: "#/components/schemas/DashboardProperty" }
        upcoming:
          type: array
          description: События на 7 дней вперёд и просрочки.
          items: { $ref: "#/components/schemas/CalendarEventDTO" }

    # ============================================================ Файлы
    FileUpload:
      type: object
      required: [file, category]
      properties:
        file: { type: string, format: binary }
